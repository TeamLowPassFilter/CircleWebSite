[build]
  command = "hugo --gc --minify --baseURL \"${URL}\""
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.152.2"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://app.netlify.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://sheets.googleapis.com https://app.netlify.com; frame-src https://app.netlify.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
