{{ partial "header.html" . }}

<section id="activities" class="intro">
  <p class="eyebrow">LOW PASS FILTER / CIRCLE</p>
  <h1>Low Pass Filter</h1>
  <p class="intro-label">活動紹介</p>
  <p>同人サークル「Low Pass Filter」</p>
  <p>不定期で同人活動を行っています。</p>
  <a class="text-link" href="#products">作品を見る <span aria-hidden="true">→</span></a>
</section>

<section id="products" class="home-products" aria-labelledby="products-heading">
  <div class="section-heading">
    <div>
      <p class="eyebrow">WORKS</p>
      <h2 id="products-heading">作品</h2>
    </div>
    <a class="text-link" href="{{ "/products/" | relURL }}">作品一覧へ <span aria-hidden="true">→</span></a>
  </div>
  <div class="product-grid">
    {{ range where .Site.RegularPages "Section" "products" }}
      {{ .Render "products" }}
    {{ end }}
  </div>
</section>

{{ partial "footer.html" . }}
