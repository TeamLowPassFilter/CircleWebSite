<article class="product-card">
  <a class="product-card-image" href="{{ .RelPermalink }}">
    <img src="{{ printf "/%s" .Params.thumbnail | relURL }}" alt="{{ .Title }}の表紙" loading="lazy">
  </a>
  <div class="product-card-content">
    <p class="product-meta">{{ with .Params.tags }}{{ delimit . "・" }}{{ end }}{{ with .Keywords }} / {{ delimit . "・" }}{{ end }}</p>
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    {{ with .Summary }}<p class="product-summary">{{ . }}</p>{{ end }}
    {{ if .Params.soldout }}<p class="availability">頒布終了</p>{{ end }}
  </div>
</article>
