{{ partial "header.html" . }}

<article class="product-detail">
  <p><a href="{{ "/products/" | relURL }}">← 作品一覧</a></p>
  <h1>{{ .Title }}</h1>
  <div class="product-detail-body">
    <div class="product-detail-image">
      <img src="{{ printf "/%s" .Params.thumbnail | relURL }}" alt="{{ .Title }}の表紙">
    </div>
    <div>
      {{ with .Params.tags }}<p>{{ delimit . "・" }}</p>{{ end }}
      {{ with .Keywords }}<p>{{ delimit . "・" }}</p>{{ end }}
      {{ if .Params.soldout }}<p class="availability">頒布終了</p>{{ end }}
      <div class="entry-content">{{ .Content }}</div>
    </div>
  </div>
</article>

{{ partial "footer.html" . }}
